<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Advanix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
        <span>Advanix<span class="text-gradient">Jobs</span></span>
      </a>
      <div class="nav-links" id="nav-links"></div>
      <div class="auth-btns" id="auth-btns"></div>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="section" style="padding: 40px 0; min-height: 80vh;">
    <div class="container" style="max-width: 520px;">
      <div class="text-center mb-8">
        <a href="index.html" class="logo mb-4" style="font-size: 1.5rem;">
          <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
          <span>Advanix<span class="text-gradient">Jobs</span></span>
        </a>
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Create your account</h1>
        <p class="text-slate-600">Join Advanix as a student or recruiter.</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 md:p-12">
        <form id="register-form">
          <!-- Role selection -->
          <div class="form-group mb-6">
            <label class="font-semibold text-slate-700 mb-3 block">I am a</label>
            <div class="flex gap-2">
              <button type="button" id="role-student" class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 border-indigo-600 bg-indigo-50 text-indigo-700 rounded-lg font-semibold transition" onclick="window.toggleRegisterRole('student')">
                <i class="fas fa-user-graduate"></i> Student
              </button>
              <button type="button" id="role-recruiter" class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 border-slate-200 bg-white text-slate-600 rounded-lg font-semibold transition hover:border-indigo-300" onclick="window.toggleRegisterRole('recruiter')">
                <i class="fas fa-building"></i> Recruiter
              </button>
            </div>
            <input type="hidden" id="register-role" value="student" />
          </div>

          <!-- Student fields -->
          <div id="student-fields">
            <div class="grid md:grid-cols-2 gap-4">
              <div class="form-group">
                <label for="register-name">Full name</label>
                <input type="text" id="register-name" class="form-control" placeholder="Aarav Sharma" required />
              </div>
              <div class="form-group">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" class="form-control" placeholder="you@college.edu" required />
              </div>
            </div>
            <div class="form-group">
              <label for="register-password">Password</label>
              <div class="position-relative">
                <input type="password" id="register-password" class="form-control pr-10" placeholder="••••••••" required />
                <button type="button" id="toggle-password" class="password-toggle">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <p class="text-xs text-slate-500 mt-1">Minimum 6 characters</p>
            </div>
            <div class="grid md:grid-cols-2 gap-4">
              <div class="form-group">
                <label for="register-college">College name</label>
                <input type="text" id="register-college" class="form-control" placeholder="Delhi Technological University" required />
              </div>
              <div class="form-group">
                <label for="register-degree">Degree</label>
                <input type="text" id="register-degree" class="form-control" placeholder="Bachelor of Technology" required />
              </div>
            </div>
            <div class="form-group">
              <label for="register-year">Graduation year</label>
              <input type="number" id="register-year" class="form-control" placeholder="2025" min="2020" max="2035" required />
            </div>
            <div class="form-group">
              <label for="register-skills">Skills (comma-separated)</label>
              <input type="text" id="register-skills" class="form-control" placeholder="HTML, CSS, JavaScript, Python, React" required />
              <p class="text-xs text-slate-500 mt-1">Used to calculate skill-match with jobs.</p>
            </div>
          </div>

          <!-- Recruiter fields (hidden by default) -->
          <div id="recruiter-fields" class="hidden">
            <div class="grid md:grid-cols-2 gap-4">
              <div class="form-group">
                <label for="register-name">Full name</label>
                <input type="text" id="register-name" class="form-control" placeholder="Priya Mehta" required />
              </div>
              <div class="form-group">
                <label for="register-email">Official email</label>
                <input type="email" id="register-email" class="form-control" placeholder="priya@company.com" required />
              </div>
            </div>
            <div class="form-group">
              <label for="register-password">Password</label>
              <div class="position-relative">
                <input type="password" id="register-password" class="form-control pr-10" placeholder="••••••••" required />
                <button type="button" id="toggle-password" class="password-toggle">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <p class="text-xs text-slate-500 mt-1">Minimum 6 characters</p>
            </div>
            <div class="form-group">
              <label for="register-company">Company name</label>
              <input type="text" id="register-company" class="form-control" placeholder="Zomato" required />
            </div>
            <div class="form-group">
              <label for="register-designation">Designation</label>
              <input type="text" id="register-designation" class="form-control" placeholder="Talent Acquisition Lead" required />
            </div>
          </div>

          <p class="text-xs text-amber-600 mb-6 bg-amber-50 px-3 py-2 rounded border border-amber-100">
            <i class="fas fa-info-circle mr-2"></i>
            <strong>Demo mode:</strong> Registration is simulated using LocalStorage. Not production-secure.
          </p>

          <button type="submit" class="btn btn-primary btn-lg w-full">Create Account</button>
        </form>

        <div class="mt-8 text-center">
          <p class="text-slate-600">Already have an account?</p>
          <a href="login.html" class="text-indigo-600 font-semibold hover:text-indigo-700">Log in</a>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    import { updateNavbar } from './js/app.js';
    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      // Pre-select role from URL query (?role=recruiter)
      const params = new URLSearchParams(location.search);
      if (params.get('role') === 'recruiter') {
        const btn = document.getElementById('role-recruiter');
        if (btn) btn.click();
      }
      window.initRegisterPage();
    });
  </script>
</body>
</html>
