<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Smart JobConnect</title>
  <meta name="description" content="Smart JobConnect - Register as a student or recruiter." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
        <span>Smart<span class="text-indigo-600"> JobConnect</span></span>
      </a>

      <div class="nav-links" id="nav-links"></div>

      <div class="auth-btns" id="auth-btns"></div>

      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="section" style="padding: 80px 0; min-height: auto;">
    <div class="container">
      <div class="max-w-md mx-auto text-center mb-12">
        <a href="index.html" class="logo mb-6" style="font-size: 1.5rem;">
          <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
          <span>Smart<span class="text-indigo-600"> JobConnect</span></span>
        </a>
        <h1 class="text-3xl font-bold text-navy-900 mb-2">Create your account</h1>
        <p class="text-slate-500">Join Smart JobConnect as a student or recruiter.</p>
      </div>

      <div class="bg-white rounded-3xl shadow-lg border border-border p-8 md:p-12 max-w-md mx-auto">
        <form id="register-form">
          <!-- Role selection -->
          <div class="form-group mb-6">
            <label class="text-sm font-medium text-slate-600 block mb-3">I am a</label>
            <div class="flex gap-2">
              <button type="button" id="role-student" class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 border-indigo-600 bg-indigo-50 text-indigo-700 rounded-lg font-semibold transition" onclick="window.toggleRegisterRole('student')">
                <i class="fas fa-user-graduate"></i> Student
              </button>
              <button type="button" id="role-recruiter" class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 border-violet-200 bg-violet-50 text-violet-600 rounded-lg font-semibold transition hover:border-violet-300" onclick="window.toggleRegisterRole('recruiter')">
                <i class="fas fa-building"></i> Recruiter
              </button>
            </div>
            <input type="hidden" id="register-role" value="student" />
          </div>

          <!-- Student fields -->
          <div id="student-fields">
            <div class="grid md:grid-cols-2 gap-4">
              <div class="form-group">
                <label for="register-name" class="text-sm font-medium text-slate-600 block mb-2">Full name</label>
                <input type="text" id="register-name" class="form-control" placeholder="Aarav Sharma" required />
              </div>
              <div class="form-group">
                <label for="register-email" class="text-sm font-medium text-slate-600 block mb-2">Email</label>
                <input type="email" id="register-email" class="form-control" placeholder="you@college.edu" required />
              </div>
            </div>
            <div class="form-group">
              <label for="register-password" class="text-sm font-medium text-slate-600 block mb-2">Password</label>
              <div class="position-relative">
                <input type="password" id="register-password" class="form-control pr-8" placeholder="••••••••" required />
                <button type="button" id="toggle-password" class="password-toggle">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <p class="text-xs text-slate-500 mt-1">Minimum 6 characters</p>
            </div>
            <div class="grid md:grid-cols-2 gap-4">
              <div class="form-group">
                <label for="register-college" class="text-sm font-medium text-slate-600 block mb-2">College name</label>
                <input type="text" id="register-college" class="form-control" placeholder="Delhi Technological University" required />
              </div>
              <div class="form-group">
                <label for="register-degree" class="text-sm font-medium text-slate-600 block mb-2">Degree</label>
                <input type="text" id="register-degree" class="form-control" placeholder="Bachelor of Technology" required />
              </div>
            </div>
            <div class="form-group">
              <label for="register-year" class="text-sm font-medium text-slate-600 block mb-2">Graduation year</label>
              <input type="number" id="register-year" class="form-control" placeholder="2025" min="2020" max="2035" required />
            </div>
            <div class="form-group">
              <label for="register-skills" class="text-sm font-medium text-slate-600 block mb-2">Skills (comma-separated)</label>
              <input type="text" id="register-skills" class="form-control" placeholder="HTML, CSS, JavaScript, Python, React" required />
              <p class="text-xs text-slate-500 mt-1">Used to calculate skill-match with jobs.</p>
            </div>
          </div>
        </form>

        <div class="mt-8 text-center">
          <p class="text-slate-500">Already have an account?</p>
          <a href="login.html" class="text-indigo-500 font-semibold hover:text-indigo-600">Log in</a>
        </div>

        <div class="mt-6 border-t border-border pt-6 text-center">
          <p class="text-sm text-slate-500 mb-2">Continue as</p>
          <div class="flex gap-3 justify-center">
            <button class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border border-indigo-500 rounded-lg bg-indigo-50 text-indigo-700 text-sm font-medium hover:bg-indigo-100 transition">
              <span class="w-5 h-5 rounded-full bg-indigo-600 flex items-center justify-center text-xs text-white">S</span>
              Student
            </button>
            <button class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border border-indigo-500 rounded-lg bg-indigo-50 text-indigo-700 text-sm font-medium hover:bg-indigo-100 transition">
              <span class="w-5 h-5 rounded-full bg-violet-600 flex items-center justify-center text-xs text-white">R</span>
              Recruiter
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    import { updateNavbar } from './js/app.js';
    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      // Pre-select role from URL query (?role=recruiter)
      const params = new URLSearchParams(location.search);
      if (params.get('role') === 'recruiter') {
        const btn = document.getElementById('role-recruiter');
        if (btn) btn.click();
      }
      window.initRegisterPage();
    });
  </script>

</body>
</html>
