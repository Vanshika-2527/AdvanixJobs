<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Details | Smart JobConnect</title>
  <meta name="description" content="Smart JobConnect - Job details and AI-powered skill matching." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
        <span>Smart<span class="text-indigo-600"> JobConnect</span></span>
      </a>

      <div class="nav-links" id="nav-links"></div>

      <div class="auth-btns" id="auth-btns"></div>

      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="section" style="padding-top: 80px; padding-bottom: 80px;">
    <div class="container">
      <a href="jobs.html" class="flex items-center gap-2 text-slate-500 text-sm mb-8 inline-block">
        <i class="fas fa-arrow-left"></i> Back to Jobs
      </a>

      <div class="container mx-auto max-w-2xl">
        <!-- Hero header -->
        <div class="bg-white rounded-3xl shadow-lg border border-border overflow-hidden mb-8" id="job-hero">
          <!-- Populated by JS -->
        </div>

        <!-- Details content -->
        <div class="bg-white rounded-3xl shadow-lg border border-border">
          <div class="p-6 md:p-8" id="job-details-content">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Actions -->
        <div class="p-6 md:p-8 border-t border-border bg-slate-50" id="job-actions">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="mt-8 text-center">
        <p class text-sm text-slate-500">
          <strong>Note:</strong> All job listings marked as sample data are prototype listings for this demo. Applications are stored locally in your browser.
        </p>
      </div>
    </div>
  </section>

  <script type="module">
    import { updateNavbar } from './js/app.js';
    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      window.initJobDetailsPage();
    });
  </script>

</body>
</html>
