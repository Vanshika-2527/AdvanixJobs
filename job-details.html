<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Details | Advanix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
        <span>Advanix<span class="text-gradient">Jobs</span></span>
      </a>
      <div class="nav-links" id="nav-links"></div>
      <div class="auth-btns" id="auth-btns"></div>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="section" style="padding-top: 40px; padding-bottom: 40px;">
    <div class="container" style="max-width: 900px;">
      <a href="jobs.html" class="text-sm text-slate-500 mb-4 inline-block flex items-center gap-1">
        <i class="fas fa-arrow-left"></i> Back to jobs
      </a>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <!-- Hero header -->
        <div class="p-6 md:p-8" id="job-hero">
          <!-- Populated by JS -->
        </div>

        <!-- Details content -->
        <div class="p-6 md:p-8">
          <div id="job-details-content">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Actions -->
        <div class="p-6 md:p-8 border-t border-slate-100 bg-slate-50">
          <div class="grid md:grid-cols-2 gap-4" id="job-actions">
            <!-- Populated by JS -->
          </div>
        </div>
      </div>

      <div class="mt-8 text-center text-slate-500 text-sm">
        <p>
          <strong>Note:</strong> All job listings marked "Demo (Sample Data)" are sample listings for this prototype.
          Applications are stored locally in your browser and are not sent to any real employer.
        </p>
      </div>
    </div>
  </section>

  <script type="module">
    import { updateNavbar } from './js/app.js';
    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      window.initJobDetailsPage();
    });
  </script>
</body>
</html>
