<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companies | Advanix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
        <span>Advanix<span class="text-gradient">Jobs</span></span>
      </a>
      <div class="nav-links" id="nav-links"></div>
      <div class="auth-btns" id="auth-btns"></div>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="section" style="padding-top: 60px;">
    <div class="container">
      <div class="section-header">
        <h1>Top <span class="text-gradient">Companies</span></h1>
        <p>Explore companies hiring on Advanix and see their open opportunities.</p>
      </div>

      <div class="companies-grid" id="companies-list">
        <!-- Populated by JS from job data -->
      </div>

      <div class="mt-10 text-center text-slate-500 text-sm">
        <p>
          Company logos are generated placeholders for this prototype. All listings shown are sample/demo data.
          Visit <a href="jobs.html" class="text-indigo-600 font-semibold">Find Jobs</a> to browse open positions.
        </p>
      </div>
    </div>
  </section>

  <script type="module">
    import { getAllJobs } from './js/jobs.js';
    import { updateNavbar } from './js/app.js';

    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      const container = document.getElementById('companies-list');
      if (!container) return;

      // Unique companies from job data
      const jobs = getAllJobs();
      const companies = {};
      jobs.forEach((job) => {
        if (!companies[job.company]) {
          companies[job.company] = {
            name: job.company,
            logo: job.companyLogo,
            jobs: 0,
          };
        }
        companies[job.company].jobs++;
      });

      const list = Object.values(companies);
      container.innerHTML = list
        .map(
          (c) => `
          <div class="company-card group" onclick="location.href='jobs.html?q=${encodeURIComponent(c.name)}'">
            <img src="${c.logo}" alt="${c.name}" class="company-logo" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.name)}&background=4F46E5&color=fff'">
            <h3>${c.name}</h3>
            <p class="text-slate-500 text-sm">${c.jobs} ${c.jobs === 1 ? 'opening' : 'openings'}</p>
          </div>
        `
        )
        .join('');
    });
  </script>
</body>
</html>
