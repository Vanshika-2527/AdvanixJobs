<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | Advanix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
        <span>Advanix<span class="text-gradient">Jobs</span></span>
      </a>
      <div class="nav-links" id="nav-links"></div>
      <div class="auth-btns" id="auth-btns"></div>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="section" style="padding: 40px 0; min-height: 80vh;">
    <div class="container" style="max-width: 480px;">
      <div class="text-center mb-8">
        <a href="index.html" class="logo mb-4" style="font-size: 1.5rem;">
          <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
          <span>Advanix<span class="text-gradient">Jobs</span></span>
        </a>
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Welcome back</h1>
        <p class="text-slate-600">Sign in to access your dashboard and applications.</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 md:p-12">
        <form id="login-form">
          <div class="form-group position-relative">
            <label for="login-email">Email address</label>
            <input type="email" id="login-email" class="form-control" placeholder="you@college.edu" required />
          </div>

          <div class="form-group position-relative">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required />
            <button type="button" id="toggle-password" class="password-toggle">
              <i class="fas fa-eye"></i>
            </button>
          </div>

          <div class="form-group mb-4">
            <label class="font-semibold text-slate-700 mb-3 block">Continue as</label>
            <div class="flex gap-2">
              <label class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 border-indigo-600 bg-indigo-50 text-indigo-700 rounded-lg font-semibold transition cursor-pointer">
                <input type="radio" name="role" value="student" checked class="hidden" />
                <i class="fas fa-user-graduate"></i> Student
              </label>
              <label class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 border-slate-200 bg-white text-slate-600 rounded-lg font-semibold transition cursor-pointer hover:border-indigo-300">
                <input type="radio" name="role" value="recruiter" class="hidden" />
                <i class="fas fa-building"></i> Recruiter
              </label>
            </div>
          </div>

          <div class="form-group flex items-center justify-between mb-6">
            <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
              <input type="checkbox" class="form-control" style="width: auto; display: inline-block;" />
              Remember me
            </label>
            <a href="#" class="text-sm text-indigo-600 hover:text-indigo-700">Forgot password?</a>
          </div>

          <p class="text-xs text-amber-600 mb-6 bg-amber-50 px-3 py-2 rounded border border-amber-100">
            <i class="fas fa-info-circle mr-2"></i>
            <strong>Demo mode:</strong> Authentication is simulated using LocalStorage. Not production-secure.
          </p>

          <button type="submit" class="btn btn-primary btn-lg w-full">Log in</button>
        </form>

        <div class="mt-8 text-center">
          <p class="text-slate-600">Don't have an account?</p>
          <a href="register.html" class="text-indigo-600 font-semibold hover:text-indigo-700">Create an account</a>
        </div>

        <div class="mt-6 border-t border-slate-200 pt-6 text-center">
          <p class="text-sm text-slate-500 mb-2">Continue as</p>
          <div class="flex gap-3 justify-center">
            <button class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border border-slate-200 rounded-lg bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition">
              <span class="w-5 h-5 rounded-full bg-indigo-600 flex items-center justify-center text-xs text-white">S</span>
              Student
            </button>
            <button class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border border-slate-200 rounded-lg bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition">
              <span class="w-5 h-5 rounded-full bg-purple-600 flex items-center justify-center text-xs text-white">R</span>
              Recruiter
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    import { updateNavbar } from './js/app.js';
    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      // The login form handler is initialized by app.js initLoginPage
      window.initLoginPage();
    });
  </script>
</body>
</html>
