<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | Smart JobConnect</title>
  <meta name="description" content="Smart JobConnect - Log in to your account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
        <span>Smart<span class="text-indigo-600"> JobConnect</span></span>
      </a>

      <div class="nav-links" id="nav-links"></div>

      <div class="auth-btns" id="auth-btns"></div>

      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="section" style="padding: 80px 0; min-height: auto;">
    <div class="container">
      <div class="max-w-md mx-auto text-center mb-12">
        <a href="index.html" class="logo mb-6" style="font-size: 1.5rem;">
          <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
          <span>Smart<span class="text-indigo-600"> JobConnect</span></span>
        </a>
        <h1 class="text-3xl font-bold text-navy-900 mb-2">Welcome back</h1>
        <p class="text-slate-500">Sign in to access your dashboard and applications.</p>
      </div>

      <div class="bg-white rounded-3xl shadow-lg border border-border p-8 md:p-12 max-w-md mx-auto">
        <form id="login-form">
          <div class="form-group position-relative">
            <label for="login-email" class="text-sm font-medium text-slate-600 block mb-2">Email address</label>
            <input type="email" id="login-email" class="form-control" placeholder="you@college.edu" required />
          </div>

          <div class="form-group position-relative">
            <label for="login-password" class="text-sm font-medium text-slate-600 block mb-2">Password</label>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required />
            <button type="button" id="toggle-password" class="password-toggle">
              <i class="fas fa-eye"></i>
            </button>
          </div>

          <div class="form-group mb-6">
            <label class="font-semibold text-slate-600 mb-3 block">Continue as</label>
            <div class="flex gap-2">
              <label class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 border-indigo-600 bg-indigo-50 text-indigo-700 rounded-lg font-semibold transition cursor-pointer">
                <input type="radio" name="role" value="student" checked class="hidden" />
                <i class="fas fa-user-graduate"></i> Student
              </label>
              <label class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border-2 border-slate-200 bg-white text-slate-600 rounded-lg font-semibold transition cursor-pointer hover:border-indigo-300">
                <input type="radio" name="role" value="recruiter" class="hidden" />
                <i class="fas fa-building"></i> Recruiter
              </label>
            </div>
          </div>

          <div class="form-group flex items-center justify-between mb-6">
            <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
              <input type="checkbox" class="form-control" style="width: auto; display: inline-block;" />
              Remember me
            </label>
            <a href="#" class="text-sm text-indigo-500 hover:text-indigo-600">Forgot password?</a>
          </div>

          <p class="text-xs text-slate-500 mb-4 bg-indigo-50 px-3 py-2 rounded border border-indigo-100">
            <i class="fas fa-info-circle mr-2"></i>
            <strong>Demo mode:</strong> Authentication is simulated using LocalStorage. Not production-secure.
          </p>

          <button type="submit" class="btn btn-primary btn-lg w-full">Log in</button>
        </form>

        <div class="mt-8 text-center">
          <p class="text-slate-500">Don't have an account?</p>
          <a href="register.html" class="text-indigo-500 font-semibold hover:text-indigo-600">Create an account</a>
        </div>

        <div class="mt-6 border-t border-border pt-6 text-center">
          <p class="text-sm text-slate-500 mb-2">Continue as</p>
          <div class="flex gap-3 justify-center">
            <button class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border border-indigo-500 rounded-lg bg-indigo-50 text-indigo-700 text-sm font-medium hover:bg-indigo-100 transition">
              <span class="w-5 h-5 rounded-full bg-indigo-600 flex items-center justify-center text-xs text-white">S</span>
              Student
            </button>
            <button class="flex-1 flex items-center justify-center gap-2 px-4 py-3 border border-indigo-500 rounded-lg bg-indigo-50 text-indigo-700 text-sm font-medium hover:bg-indigo-100 transition">
              <span class="w-5 h-5 rounded-full bg-violet-600 flex items-center justify-center text-xs text-white">R</span>
              Recruiter
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    import { updateNavbar } from './js/app.js';
    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      window.initLoginPage();
    });
  </script>

</body>
</html>
