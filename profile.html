<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | Advanix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
        <span>Advanix<span class="text-gradient">Jobs</span></span>
      </a>
      <div class="nav-links" id="nav-links"></div>
      <div class="auth-btns" id="auth-btns"></div>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="section" style="padding-top: 40px;">
    <div class="container" style="max-width: 700px;">
      <a href="student-dashboard.html" class="text-sm text-slate-500 mb-4 inline-block flex items-center gap-1">
        <i class="fas fa-arrow-left"></i> Back to dashboard
      </a>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
        <!-- Profile header -->
        <div class="p-8 md:p-10 bg-slate-50 border-b border-slate-100">
          <div class="flex flex-col md:flex-row md:items-center gap-6">
            <div class="relative w-32 h-32 mx-auto md:mx-0 shrink-0">
              <div id="profile-photo" class="w-full h-full rounded-full overflow-hidden border-4 border-white shadow-sm bg-slate-200 flex items-center justify-center text-slate-400 text-xl">
                <!-- Photo or initials injected by JS -->
              </div>
            </div>
            <div class="flex-1">
              <h1 id="profile-name" class="text-2xl font-bold text-slate-900">Student Name</h1>
              <p id="profile-email" class="text-slate-600 mt-1">email@college.edu</p>
              <p id="profile-role" class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded inline-block mt-2">Student</p>
            </div>
            <button id="edit-profile-btn" class="btn btn-outline px-6 py-3 text-sm font-medium">
              <i class="fas fa-pen mr-2"></i> Edit Profile
            </button>
          </div>
        </div>

        <!-- Profile details grid -->
        <div class="p-8 md:p-10 grid md:grid-cols-2 gap-6">
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">College</p>
            <p id="profile-college" class="text-slate-800">—</p>
          </div>
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Degree</p>
            <p id="profile-degree" class="text-slate-800">—</p>
          </div>
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Graduation Year</p>
            <p id="profile-year" class="text-slate-800">—</p>
          </div>
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Skills</p>
            <p id="profile-skills" class="text-slate-800">—</p>
          </div>
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Resume URL</p>
            <p id="profile-resume" class="text-slate-800 text-sm break-all">—</p>
          </div>
          <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Email</p>
            <p id="profile-email-detail" class="text-slate-800">—</p>
          </div>
        </div>
      </div>

      <!-- Logout -->
      <div class="mt-8 text-center">
        <button id="profile-logout" class="text-sm text-rose-600 font-medium hover:text-rose-700 flex items-center justify-center gap-2">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>
  </section>

  <!-- Edit profile modal -->
  <div class="modal-overlay hidden" id="edit-profile-modal">
    <div class="modal" style="max-width: 560px;">
      <div class="modal-header">
        <h3>Edit Profile</h3>
        <button id="edit-profile-close" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="edit-profile-form">
          <div class="form-group">
            <label>Full name</label>
            <input type="text" id="edit-name" class="form-control" required />
          </div>
          <div class="form-group">
            <label>College</label>
            <input type="text" id="edit-college" class="form-control" />
          </div>
          <div class="form-group">
            <label>Degree</label>
            <input type="text" id="edit-degree" class="form-control" />
          </div>
          <div class="form-group">
            <label>Graduation year</label>
            <input type="number" id="edit-year" class="form-control" />
          </div>
          <div class="form-group">
            <label>Skills (comma-separated)</label>
            <input type="text" id="edit-skills" class="form-control" placeholder="HTML, CSS, JavaScript" />
          </div>
          <div class="form-group">
            <label>Resume URL</label>
            <input type="url" id="edit-resume" class="form-control" placeholder="https://..." />
          </div>
          <div class="form-group">
            <label>Profile photo URL</label>
            <input type="url" id="edit-photo" class="form-control" placeholder="https://..." />
            <p class="text-xs text-slate-500 mt-1">Use an image URL or a ui-avatars.com link.</p>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" id="edit-profile-cancel" class="btn btn-secondary">Cancel</button>
        <button type="button" id="save-profile-btn" class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { updateNavbar } from './js/app.js';
    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      window.initProfilePage();

      // Edit modal wiring
      const modal = document.getElementById('edit-profile-modal');
      const openBtn = document.getElementById('edit-profile-btn');
      const closeBtn = document.getElementById('edit-profile-close');
      const cancelBtn = document.getElementById('edit-profile-cancel');

      if (openBtn) openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); });
      [closeBtn, cancelBtn].forEach((btn) => {
        if (btn) btn.addEventListener('click', () => { modal.classList.add('hidden'); });
      });
      if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });
    });
  </script>
</body>
</html>
