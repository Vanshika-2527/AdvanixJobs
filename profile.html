<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | Smart JobConnect</title>
  <meta name="description" content="Smart JobConnect - My profile page." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-briefcase"></i></div>
        <span>Smart<span class="text-indigo-600"> JobConnect</span></span>
      </a>

      <div class="nav-links" id="nav-links"></div>

      <div class="auth-btns" id="auth-btns">
        <button onclick="handleLogout()" class="btn btn-outline text-slate-600 hover:text-indigo-600">Logout</button>
      </div>

      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="section" style="padding-top: 80px; padding-bottom: 80px;">
    <div class="container">
      <div class="max-w-2xl mx-auto">
        <a href="student-dashboard.html" class="text-sm text-indigo-500 mb-6 flex items-center gap-1">
          <i class="fas fa-arrow-left"></i> Back to dashboard
        </a>

        <div class="bg-white rounded-3xl shadow-lg border border-border overflow-hidden">
          <!-- Profile header -->
          <div class="p-8 md:p-10 bg-indigo-50 border-b border-border">
            <div class="flex flex-col md:flex-row md:items-center gap-6">
              <div class="relative w-32 h-32 mx-auto md:mx-0 shrink-0">
                <div id="profile-photo" class="w-full h-full rounded-full overflow-hidden border-4 border-white shadow-sm bg-white flex items-center justify-center text-indigo-400 text-xl">
                  <!-- Photo or initials injected by JS -->
                </div>
              </div>
              <div class="flex-1">
                <h1 id="profile-name" class="text-2xl font-bold text-navy-900">Student Name</h1>
                <p id="profile-email" class="text-slate-500 mt-1">email@college.edu</p>
                <p id="profile-role" class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded inline-block mt-2">Student</p>
              </div>
              <button id="edit-profile-btn" class="btn btn-outline px-6 py-3 text-sm font-medium">
                <i class="fas fa-pen mr-2"></i> Edit Profile
              </button>
            </div>
          </div>

          <!-- Profile details grid -->
          <div class="p-8 md:p-10 grid md:grid-cols-2 gap-6">
            <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
              <p class="text-xs font-medium text-indigo-600 uppercase tracking-wider mb-1">College</p>
              <p id="profile-college" class="text-slate-700">—</p>
            </div>
            <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
              <p class="text-xs font-medium text-indigo-600 uppercase tracking-wider mb-1">Degree</p>
              <p id="profile-degree" class="text-slate-700">—</p>
            </div>
            <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
              <p class="text-xs font-medium text-indigo-600 uppercase tracking-wider mb-1">Graduation Year</p>
              <p id="profile-year" class="text-slate-700">—</p>
            </div>
            <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
              <p class="text-xs font-medium text-indigo-600 uppercase tracking-wider mb-1">Skills</p>
              <p id="profile-skills" class="text-slate-700">—</p>
            </div>
            <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
              <p class="text-xs font-medium text-indigo-600 uppercase tracking-wider mb-1">Resume URL</p>
              <p id="profile-resume" class="text-slate-700 text-sm break-all">—</p>
            </div>
            <div class="bg-indigo-50 rounded-xl p-4 border border-indigo-100">
              <p class="text-xs font-medium text-indigo-600 uppercase tracking-wider mb-1">Email</p>
              <p id="profile-email-detail" class="text-slate-700">—</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Edit profile modal -->
    <div class="modal-overlay hidden" id="edit-profile-modal">
      <div class="modal" style="max-width: 560px;">
        <div class="modal-header">
          <h3 class="text-xl font-bold text-navy-900">Edit Profile</h3>
          <button id="edit-profile-close" class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <form id="edit-profile-form">
            <div class="form-group">
              <label for="edit-name" class="text-sm font-medium text-slate-600 block mb-2">Full name</label>
              <input type="text" id="edit-name" class="form-control" required />
            </div>
            <div class="form-group">
              <label for="edit-college" class="text-sm font-medium text-slate-600 block mb-2">College</label>
              <input type="text" id="edit-college" class="form-control" />
            </div>
            <div class="form-group">
              <label for="edit-degree" class="text-sm font-medium text-slate-600 block mb-2">Degree</label>
              <input type="text" id="edit-degree" class="form-control" />
            </div>
            <div class="form-group">
              <label for="edit-year" class="text-sm font-medium text-slate-600 block mb-2">Graduation year</label>
              <input type="number" id="edit-year" class="form-control" />
            </div>
            <div class="form-group">
              <label for="edit-skills" class="text-sm font-medium text-slate-600 block mb-2">Skills (comma-separated)</label>
              <input type="text" id="edit-skills" class="form-control" placeholder="HTML, CSS, JavaScript" />
            </div>
            <div class="form-group">
              <label for="edit-resume" class="text-sm font-medium text-slate-600 block mb-2">Resume URL</label>
              <input type="url" id="edit-resume" class="form-control" placeholder="https://..." />
              <p class="text-xs text-slate-500 mt-1">Use an image URL or a ui-avatars.com link.</p>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" id="edit-profile-cancel" class="btn btn-secondary">Cancel</button>
          <button type="button" id="save-profile-btn" class="btn btn-primary">Save Changes</button>
        </div>
      </div>
    </div>

    <div class="mt-8 text-center">
      <button id="profile-logout" class="text-sm text-indigo-600 font-medium hover:text-indigo-700 flex items-center gap-2">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>

  </section>

  <script type="module">
    import { updateNavbar } from './js/app.js';
    document.addEventListener('DOMContentLoaded', () => {
      updateNavbar();
      window.initProfilePage();

      // Edit modal wiring
      const modal = document.getElementById('edit-profile-modal');
      const openBtn = document.getElementById('edit-profile-btn');
      const closeBtn = document.getElementById('edit-profile-close');
      const cancelBtn = document.getElementById('edit-profile-cancel');

      if (openBtn) openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); });
      [closeBtn, cancelBtn].forEach((btn) => {
        if (btn) btn.addEventListener('click', () => { modal.classList.add('hidden'); });
      });
      if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });
    });
  </script>

</body>
</html>
